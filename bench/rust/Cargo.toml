[package]
name = "ovl-bench-rust"
version = "0.1.0"
edition = "2024"
[dependencies]
axum = "0.8"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
tower-http = {version="0.6",features=["fs"]}
walkdir = "2"
[profile.release]
lto = true
codegen-units = 1
