name: Verify Rust
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: make test
      - run: python3 scripts/generate-types.py && git diff --exit-code -- web/src/api.generated.ts
      - run: cargo check --locked --manifest-path bench/rust/Cargo.toml
      - run: cargo fmt --manifest-path bench/rust/Cargo.toml -- --check
      - run: OVL_ACCELERATOR=cpu cargo test --locked --workspace -- --ignored
      - run: cargo build --locked --package ovl-server && mkdir -p bin && cp target/debug/ovl-server bin/ovl
      - run: cd web && npx playwright install --with-deps chromium firefox webkit && npm run test:e2e
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          outputs: type=cacheonly
