# In the http block, outside server:
# limit_req_zone $binary_remote_addr zone=ovl_login:1m rate=10r/m;
#
# Include these locations in your existing HTTPS server. Keep its certificate setup.
location = /api/v1/login {
    limit_req zone=ovl_login burst=10 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:8096;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    client_max_body_size 64k;
}
location / {
    proxy_pass http://127.0.0.1:8096;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 60s;
    client_max_body_size 64k;
}
# The application ignores forwarded headers. TLS cookies are controlled explicitly
# with OVL_SECURE_COOKIES=true. No WebSocket endpoint is currently required.
